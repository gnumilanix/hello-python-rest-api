# Adds the app service to the infra in docker-compose.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

services:
  app:
    # Local: build from source. Deploy: set DOCKER_IMAGE to the GHCR tag.
    image: ${DOCKER_IMAGE:-necktie:local}
    build:
      context: .
    container_name: necktie-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
