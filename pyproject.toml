[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necktie"
version = "0.1.0"
description = "necktie API service"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.115",
    "fastapi-cache2[redis]>=0.2.2",
    "phonenumbers>=8.13",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "jetbase",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/necktie"]

[tool.fastapi]
entrypoint = "necktie.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py37"
src = ["src", "tests"]

[tool.ruff.lint]
# B008: Depends() in argument defaults is the idiomatic FastAPI pattern.
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
