[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necktie"
version = "0.1.0"
description = "necktie API service"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.115",
    "fastapi-cache2[redis]>=0.2.2",
    "phonenumbers>=8.13",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.1",
    "redis>=4.2,<5.0",
    "jetbase",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "httpx",
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/necktie"]

[tool.fastapi]
entrypoint = "necktie.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py37"
src = ["src", "tests"]

[tool.ruff.lint]
# B008: Depends() in argument defaults is the idiomatic FastAPI pattern.
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
mypy_path = "src"
packages = ["necktie"]
ignore_missing_imports = true
# TODO: tighten incrementally — strict mode surfaces SQLAlchemy generic issues
strict = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["necktie.repositories.*", "necktie.mappers.*"]
# SQLAlchemy/SQLModel ORM generics: load_only/selectinload/order_by/column
# types produce false-positive arg-type errors with mypy's strict stubs.
disable_error_code = ["arg-type", "call-arg", "var-annotated"]
