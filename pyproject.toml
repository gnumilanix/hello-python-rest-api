[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bowtie"
version = "0.1.0"
description = "bowtie API service"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bowtie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py36"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
